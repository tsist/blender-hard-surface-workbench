name: Hard Surface Workbench public checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HOST schema-test dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
      - name: Host contracts and numerical fixtures
        run: python -B scripts/run_host_tests.py --shard-count 4 --shard-index ${{ matrix.shard }}
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: First static package build
        run: python -B scripts/build_distribution.py --output '${{ runner.temp }}/hard-surface-first'
      - name: Independent static package build
        run: python -B scripts/build_distribution.py --output '${{ runner.temp }}/hard-surface-second'
      - name: Check byte-for-byte reproducibility
        run: python -B scripts/verify_reproducible.py '${{ runner.temp }}/hard-surface-first' '${{ runner.temp }}/hard-surface-second'
